name: Retraining trigger

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

defaults:
  run:
    working-directory: Aircraft-Engine-Predictive-Maintenance_-main

jobs:
  drift-check:
    name: Check model drift
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the drift check
        run: python retraining_trigger.py --window 100
