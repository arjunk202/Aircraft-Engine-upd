name: CD

on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ main ]

jobs:
  build-and-verify:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build the serving image
        uses: docker/build-push-action@v6
        with:
          context: ./Aircraft-Engine-Predictive-Maintenance_-main
          file: ./Aircraft-Engine-Predictive-Maintenance_-main/Dockerfile
          push: false
          load: true
          tags: aircraft-rul-api:ci
      - name: Start the container
        run: |
          docker run -d --name rul_api -p 8080:8080 aircraft-rul-api:ci
          sleep 20
      - name: Verify the health endpoint
        run: curl --fail --retry 5 --retry-delay 3 http://localhost:8080/health
      - name: Stop the container
        if: always()
        run: docker rm -f rul_api || true
