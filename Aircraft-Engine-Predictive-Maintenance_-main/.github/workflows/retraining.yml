# ---------------------------------------------------------------------------
#  Continuous Training (retraining trigger)
#  Runs on a schedule (and on demand). It checks the live prediction history for
#  model drift; if the champion has degraded beyond the configured thresholds,
#  the job fails (exit code 2), which surfaces as a red run and can notify the
#  team that retraining is due. Enabling the --retrain flag turns this from an
#  alarm into an automatic retrain-and-promote.
# ---------------------------------------------------------------------------
name: Retraining trigger

on:
  schedule:
    # Every Monday at 06:00 UTC. Adjust cadence to how fast new ground truth
    # accumulates in predictions.db.
    - cron: "0 6 * * 1"
  workflow_dispatch:   # allow manual runs from the Actions tab

jobs:
  drift-check:
    name: Check model drift
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the drift check
        # Report-only: a breach exits non-zero and marks the run red, alerting
        # the team. To make it self-healing instead, add '--retrain' here and
        # commit the updated model artefacts / registry back, or dispatch the
        # training job.
        run: python retraining_trigger.py --window 100
