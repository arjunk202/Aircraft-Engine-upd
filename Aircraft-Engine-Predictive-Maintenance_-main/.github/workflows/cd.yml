# ---------------------------------------------------------------------------
#  Continuous Deployment
#  Runs after CI succeeds on the main branch. Builds the serving container image
#  and verifies it starts and answers its health check. The final deploy step is
#  included but gated behind a manual approval environment, so the image is only
#  released when a maintainer approves it.
# ---------------------------------------------------------------------------
name: CD

on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ main ]

jobs:
  build-and-verify:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    # Only run if the CI workflow that triggered this actually passed.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: aircraft-rul-api:ci

      - name: Start the container
        run: |
          docker run -d --name rul_api -p 8080:8080 aircraft-rul-api:ci
          # Give the service time to load the champion model at startup.
          sleep 20

      - name: Verify the health endpoint
        # A build that cannot answer /health is rejected before any deploy.
        run: |
          curl --fail --retry 5 --retry-delay 3 http://localhost:8080/health

      - name: Stop the container
        if: always()
        run: docker rm -f rul_api || true

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build-and-verify
    # The 'production' environment can require a manual reviewer approval in the
    # repository settings, so deployment is a deliberate, gated step.
    environment: production

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The steps below are the deployment target. They are intentionally left
      # as the documented shape of the deploy; enabling them requires adding the
      # cloud credentials as repository secrets.
      #
      # - name: Authenticate to Google Cloud
      #   uses: google-github-actions/auth@v2
      #   with:
      #     credentials_json: ${{ secrets.GCP_SA_KEY }}
      #
      # - name: Deploy to Cloud Run
      #   uses: google-github-actions/deploy-cloudrun@v2
      #   with:
      #     service: aircraft-rul-api
      #     source: .
      #     region: europe-west1
      - name: Deployment placeholder
        run: echo "Image verified; deploy step is gated on cloud credentials."
